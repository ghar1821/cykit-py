[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cykit-py"
version = "0.0.1-alpha"
description = "Interactive cytometry analysis: FCS -> AnnData -> napari gating"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Givanna Putri", email = "putri.g@wehi.edu.au" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "anndata>=0.10",
    "scipy>=1.10",
    "flowio>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
gui = ["napari[pyqt6]>=0.5", "magicgui>=0.8", "qtpy"]
dev = ["pytest>=7", "pytest-qt>=4.4", "ruff"]

[project.scripts]
cykit = "cykit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cykit"]

[tool.ruff]
line-length = 100
